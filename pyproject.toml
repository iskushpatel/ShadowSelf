[project]
name = "shadowself"
version = "0.1.0"
description = "Learning-first multi-agent shadow profile backend"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    # Ingestion — Google APIs
    "google-api-python-client>=2.196.0",
    "google-auth>=2.53.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "httpx>=0.27.0",
    # Ingestion — Web scraping & parsing
    "playwright>=1.40.0",        # Headless browser rendering for JS-heavy sites (LinkedIn)
    "beautifulsoup4>=4.12.0",    # HTML parsing as fallback
    # Layer 1 — Ingestion (text splitting)
    "langchain>=1.3.1",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=0.3.0",
    # Layer 3 — Agents (LLMs, embeddings, structured output)
    "langchain-groq>=0.1.0",     # ChatGroq for LLMs
    "langchain-openai>=0.1.0",   # OpenAIEmbeddings (Groq doesn't have embeddings)
    "pydantic>=2.0.0",           # structured output schemas
    # Layer 3 — Background tasks
    "celery>=5.3.0",
    "redis>=5.0.0",
    # Layer 2 — Database & vectors
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    # Utils
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.32",
]
